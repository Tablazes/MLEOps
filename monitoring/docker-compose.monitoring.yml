# Draaiende monitoring-stack: Prometheus scrapet de VitaCall /metrics-prom, Grafana toont het dashboard.
# Fixt LD5 boven een losse dashboard-config: een ECHTE Grafana-server met live datasource.
#
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d
#   # Prometheus:  http://localhost:9090   (targets -> vitacall UP)
#   # Grafana:     http://localhost:3000   (admin/admin, dashboard 'VitaCall')
#   docker compose -f monitoring/docker-compose.monitoring.yml down
#
# De VitaCall-API (serve.py, lokaal of op Render) exposeert /metrics-prom in Prometheus-exposition-format.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/db.yml:ro
      - ./vitacall-dashboard.json:/var/lib/grafana/dashboards/vitacall.json:ro
