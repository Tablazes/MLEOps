# Render Blueprint (Infrastructure-as-Code) voor de VitaCall cloud-API.
# Op render.com -> "New +" -> "Blueprint" -> deze repo kiezen. Render bouwt de
# Dockerfile en deployt de service. De live publieke URL komt op het dashboard.
services:
  - type: web
    name: vitacall-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # CD-gate: pas deployen als de GitHub Actions-checks (test + docker-build)
    # groen zijn. Vervangt het oude autoDeploy: true (deploy bij elke push).
    autoDeployTrigger: checksPass
    envVars:
      - key: MODEL_PATH
        value: /app/models/sentiment_heavy.pkl
