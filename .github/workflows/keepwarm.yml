name: Keep-warm (Render free tier)

# De free tier slaapt na 15 min zonder verkeer; de eerste request daarna
# betaalt ~50s cold start. Deze ping elke 10 minuten houdt de service wakker,
# zodat operators (en de notebook-democellen) een lage p95 zien.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        run: |
          curl -fsS --max-time 60 https://mleops.onrender.com/health
